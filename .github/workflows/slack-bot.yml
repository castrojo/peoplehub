name: Slack daily trending bot

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC daily
  workflow_dispatch:
    inputs:
      window_days:
        description: 'How many days of activity to summarize'
        required: false
        default: '1'
      top_n:
        description: 'Number of repos to include in the summary'
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  post-to-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post trending summary to Slack
        run: node scripts/slack-bot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          TRENDING_WINDOW_DAYS: ${{ github.event.inputs.window_days || '1' }}
          TRENDING_TOP_N: ${{ github.event.inputs.top_n || '10' }}
